<mat-sidenav-container class="sidenav-container">

  <mat-sidenav #sidenav class="sidenav" mode="side" opened>
    <div class="nav-item">
      <mat-icon>home</mat-icon>
      <a routerLink="/revendeur" routerLinkActive="active-link">Home</a>
    </div>
    <div class="nav-item">
      <mat-icon>list</mat-icon>
      <a routerLink="/revendeur/produits" routerLinkActive="active-link">Tous les produits</a>
    </div>
    <div class="nav-item">
      <mat-icon>star</mat-icon>
      <a routerLink="/revendeur/mes-produits" routerLinkActive="active-link">Mes produits</a>
    </div>
    <div class="nav-item">
      <mat-icon>add</mat-icon>
      <a routerLink="/revendeur/ajouter-produit" routerLinkActive="active-link">Ajouter un produit</a>
    </div>
    <div class="nav-item">
      <mat-icon>account_circle</mat-icon>
      <a routerLink="/revendeur/compte" routerLinkActive="active-link">Mon compte</a>
    </div>
    <div class="nav-item">
      <mat-icon>exit_to_app</mat-icon>
      <a  (click)="disconnect()" routerLinkActive="active-link">Se déconnecter</a>
    </div>

  </mat-sidenav>


  <mat-sidenav-content>

    <div  class="card-wrapper">
      <div *ngFor="let prod of produitsRevendeur ">
        <mat-card   class="product example-card container text-uppercase shadow lg p-3 mb-3 bg-white rounded">

          <img mat-card-image alt="Photo" src="{{prod.produit.images[0].image}}" class="product-image">

          <mat-card-header>
            <mat-card-title> {{prod.produit.nom}} </mat-card-title>
            <mat-card-subtitle>{{prod.produit.plateforme}}</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content>
            <p class="produit_detail">Description : {{prod.produit.description}}</p>
            <p class="produit_stock">Stock : {{prod.stock}}</p>
            <p class="produit_prix">Prix : {{prod.prix}}</p>

            <mat-card-actions>
              <button mat-button (click)="modifierProduit(prod.id,prod)" class="modifier">Modifier produit</button>
              <button mat-button (click)="supprimerProduit(prod.id)" class="supprimer">Supprimer produit</button>
            </mat-card-actions>


          </mat-card-content>
        </mat-card>
      </div>
    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
