<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav class="sidenav" mode="side" opened>
    <p><a routerLink="/revendeur/produits" routerLinkActive="active-link">Tous les produits</a></p>
    <p><a routerLink="/revendeur/mes-produits" routerLinkActive="active-link">Mes produits</a></p>
  </mat-sidenav>

  <mat-sidenav-content>

    <div  class="card-wrapper">
      <div *ngFor="let prod of produitsRevendeur ">
        <mat-card   class="product example-card container text-uppercase shadow lg p-3 mb-3 bg-white rounded">

          <img mat-card-image alt="Photo" src="{{prod.produit.images[0].image}}" class="product-image">

          <mat-card-header>
            <mat-card-title> {{prod.produit.nom}} </mat-card-title>
            <mat-card-subtitle>{{prod.produit.plateforme}}</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content>
            <p class="produit_detail">Description : {{prod.produit.description}}</p>
            <p class="produit_stock">Stock : {{prod.stock}}</p>
            <p class="produit_prix">Prix : {{prod.prix}}</p>

            <mat-card-actions>
              <button mat-button (click)="modifierProduit(prod.id,prod)" class="modifier">Modifier produit</button>
              <button mat-button (click)="supprimerProduit(prod.id)" class="supprimer">Supprimer produit</button>
            </mat-card-actions>


          </mat-card-content>
        </mat-card>
      </div>
    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
