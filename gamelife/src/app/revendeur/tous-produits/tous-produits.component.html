<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav class="sidenav" mode="side" opened>
    <p><a routerLink="/revendeur/produits" routerLinkActive="active-link">Tous les produits</a></p>
    <p><a routerLink="/revendeur/mes-produits" routerLinkActive="active-link">Mes produits</a></p>
  </mat-sidenav>

  <mat-sidenav-content>

    <div  class="card-wrapper">

      <div *ngFor="let prod of produits | paginate: { itemsPerPage: 10, currentPage: p }">
        <mat-card   class="product example-card container  shadow lg p-3 mb-3 bg-white rounded">

          <img mat-card-image alt="Photo" src="{{prod.images[0].image}}" class="product-image">

          <mat-card-header>
            <mat-card-title> {{prod.nom}} </mat-card-title>
            <mat-card-subtitle>{{prod.plateforme}}</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content>
              <p class="produit_detail">{{prod.detail}}</p>
              <mat-card-actions>
                <button mat-button (click)="ajouterProduitAuRevendeur(prod)">Ajouter produit</button>
              </mat-card-actions>
          </mat-card-content>
        </mat-card>
      </div>

    </div>
    <div class="pagination-wrapper">
      <pagination-controls (pageChange)="p = $event"></pagination-controls>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
