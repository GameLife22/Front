<mat-dialog-content >
  <form [formGroup]="form">
    <mat-form-field>
      <mat-label>Stock Size</mat-label>
      <input matInput formControlName="stockSize">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Price</mat-label>
      <input matInput formControlName="price">
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button class="close-button" (click)="onNoClick()"><mat-icon>close</mat-icon></button>
  <button mat-button class="add-button" [mat-dialog-close]="form.value" cdkFocusInitial><mat-icon>check_small</mat-icon></button>
</mat-dialog-actions>
