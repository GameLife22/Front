<mat-dialog-content >

<h2 mat-dialog-title>Suppression de l'élément  ?</h2>


  <span>Attention, vous êtes sur le point de supprimer l'élément . Voulez-vous continuer ?</span>



</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button class="close-button" (click)="onNoClick()">Annuler</button>
  <button mat-button class="add-button" (click)="confirmDeletion()" cdkFocusInitial>Valider</button>
</mat-dialog-actions>
