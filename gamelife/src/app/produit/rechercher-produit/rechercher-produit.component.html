<form class="form-inline" (ngSubmit)="rechercherProduits(terme())">
  <div class="search">
    <input (input)="gererRechercheInput($event)" [value]="terme()" type="text" class="form-control"
           placeholder="Rechercher"
           [ngClass]="{ 'liste-produits': verifierProduitNonVide() }">
    <button type="submit">
      <mat-icon>search</mat-icon>
    </button>
  </div>
</form>
<div *ngIf="verifierProduitNonVide()" class="result">
  <mat-list>
    <mat-list-item *ngFor="let produit of produits">
      <p (click)="redirigerVersFicheProduit(produit.idProduit)">{{ produit.nom }}</p>
    </mat-list-item>
  </mat-list>
</div>
